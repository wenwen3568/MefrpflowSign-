name: 🌊 MefrpflowSign 自动签到

on:
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 0:00（北京时间 8:00）
  workflow_dispatch:          # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python sign.py
        env:
          MEFRP_USERNAME: ${{ secrets.MEFRP_USERNAME }}
          MEFRP_PASSWORD: ${{ secrets.MEFRP_PASSWORD }}
          MEFRP_LOGIN_CAPTCHA_TOKEN: ${{ secrets.MEFRP_LOGIN_CAPTCHA_TOKEN }}
          MEFRP_SIGN_CAPTCHA_TOKEN: ${{ secrets.MEFRP_SIGN_CAPTCHA_TOKEN }}
          MEFRP_USER_TOKEN: ${{ secrets.MEFRP_USER_TOKEN }}   # 可选，留空则由脚本自动登录
