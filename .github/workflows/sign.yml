name: 🌊 MefrpflowSign 自动签到        # 工作流名称

on:                            # 触发条件
  schedule:
    - cron: '0 0 * * *'       # 定时触发（每日 UTC 0:00）
  workflow_dispatch:          # 支持手动触发

jobs:                          # 作业
  sign:                        # 作业 ID
    runs-on: ubuntu-latest    # 运行环境
    steps:                    # 步骤列表
      - name: Checkout        # 拉取代码
        uses: actions/checkout@v4
      - name: Set up Python   # 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps    # 安装依赖
        run: pip install requests
      - name: Run sign        # 执行签到
        env:                  # 注入环境变量（从 Secrets 读取）
          MEFRP_USER_TOKEN: ${{ secrets.MEFRP_USER_TOKEN }}
          MEFRP_CAPTCHA_TOKEN: ${{ secrets.MEFRP_CAPTCHA_TOKEN }}
        run: python sign.py
